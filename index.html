<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Office Suite — Documents, Sheets, Slides & PDF</title>
    <link rel="icon" type="image/png" href="/brand/bamania-tech-logo.png" />
    <meta name="description" content="A local-first office suite: write documents, build spreadsheets and decks, and process PDFs without a server." />
    <script>
      try {
        var t = localStorage.getItem('novaoffice.theme');
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) {}
    </script>
  </head>
  <body class="h-full">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
